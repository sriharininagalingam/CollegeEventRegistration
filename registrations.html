<!DOCTYPE html>
<html>
<head><!DOCT
    <title>Registered Students</title>
</head>
<body>

    <h1>Registered Students</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Register Number</th>
            <th>Department</th>
            <th>Event</th>
        </tr>

        {% for student in registrations %}
        <tr>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
