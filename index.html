<!DOCTYPE html>
<html>
<head>
    <title>College Event Registration</title>
</head>
<body>

    <h1>College Event Registration</h1>

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter your name" required>
        <br><br>

        <label>Register Number:</label>
        <input type="text" name="register_number" placeholder="Enter register number" required>
        <br><br>

        <label>Department:</label>
        <input type="text" name="department" placeholder="Enter department" required>
        <br><br>

        <label>Event:</label>
        <select name="event">
            <option>AI Quiz</option>
            <option>Paper Presentation</option>
            <option>Project Expo</option>
            <option>Coding Competition</option>
            <option>Debugging contest</option>
            <option>Idea Pitching</option>
        </select>
        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
